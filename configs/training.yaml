# Training configuration for RoboImitate Imitation Learning
experiment_name: "roboimitate_imitation_learning"
seed: 42
device: "auto" # auto (cuda if available, else cpu)

# Dataset paths
dataset:
  data_dir: "data/demos"
  filename: "expert_demonstrations.npz"
  h5_filename: "expert_demonstrations.h5"
  train_val_split: 0.8
  normalize_proprio: true
  normalize_actions: true

# Behavior Cloning (BC) baseline hyperparameters
bc:
  model_type: "bc"
  vision_backbone: "nature_cnn" # nature_cnn (fast, lightweight) or resnet18
  image_size: [84, 84]
  image_channels: 3
  use_proprio: true
  proprio_dim: 4
  action_dim: 4
  hidden_dims: [256, 128]
  dropout: 0.1
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 32
  epochs: 30
  smoke_test_epochs: 2
  loss_type: "l1" # l1 or mse
  lr_scheduler: "cosine" # cosine, step, or none

# Action Chunking with Transformers (ACT) hyperparameters
act:
  model_type: "act"
  vision_backbone: "nature_cnn"
  image_size: [84, 84]
  image_channels: 3
  use_proprio: true
  proprio_dim: 4
  action_dim: 4
  chunk_size: 10 # action horizon per chunk
  d_model: 128   # transformer embedding dim (efficient for CPU and quick training)
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  learning_rate: 0.0002
  weight_decay: 0.0001
  batch_size: 16
  epochs: 30
  smoke_test_epochs: 2
  kl_weight: 10.0 # for CVAE latent style prior
  use_cvae: true
  loss_type: "l1"

# Checkpointing & Logging
logging:
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  plots_dir: "outputs/plots"
  save_freq: 5
  log_freq: 1
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
